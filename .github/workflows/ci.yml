name: CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read
  checks: write
  id-token: write

concurrency:
  group: atelier-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # No upload credentials for pull requests.
  test:
    name: Atelier PR tests
    if: github.event_name == 'pull_request'

    # Replace master with an audited full commit SHA.
    uses: stepbrobd/atelier/.github/workflows/discover.yaml@master

  # Only trusted branch pushes and manual runs can publish.
  publish:
    name: Atelier build and publish
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')

    # Replace master with the same audited full commit SHA.
    uses: stepbrobd/atelier/.github/workflows/discover.yaml@master

    secrets:
      ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
